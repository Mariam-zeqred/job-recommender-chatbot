[project]
name = "job-recommender-chatbot"
version = "0.1.0"
description = "Job-posting recommender from CV text with skill-gap explanations and a mock-interview chatbot"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobrec = ["static/*.html", "resources/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "N"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
